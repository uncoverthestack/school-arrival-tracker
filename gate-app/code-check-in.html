<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gate Scanner — Checked in (code)</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Follow the OS light/dark preference — set before first paint to avoid a flash.
    (function () {
      var query = window.matchMedia('(prefers-color-scheme: dark)');
      function apply(e) { document.documentElement.dataset.theme = e.matches ? 'dark' : 'light'; }
      apply(query);
      query.addEventListener('change', apply);
    })();
  </script>
</head>
<body>

  <div class="kiosk">
    <header class="kiosk-topbar">
      <p class="kiosk-title t-title-large">Bright Hill School</p>
      <div class="kiosk-topbar__right">
        <div class="pill pill--arrival">
          <span class="pill__dot"></span>
          <span>Arrival</span>
        </div>
        <div class="kiosk-status">
          <span class="kiosk-status__dot"></span>
          <span class="t-title-medium">online</span>
          <span class="t-body-large kiosk-status__sep">·</span>
          <span class="t-title-medium">7:29 am</span>
        </div>
      </div>
    </header>

    <main class="kiosk-content">
      <div class="scan-view">
        <div class="banner banner--success banner--wide">
          <svg class="banner__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="t-title-medium">Jubril has checked in — his parent has been notified</p>
        </div>

        <div class="id-card">
          <p class="id-card__label t-label-small">STUDENT</p>
          <span class="id-card__punch"></span>
          <div class="id-card__photo id-card__photo--filled">
            <img src="assets/demo-student.jpg" alt="" />
          </div>
        </div>

        <div class="details">
          <p class="details__name t-headline-medium-emph">Jubril Manch</p>
          <div class="details__meta">
            <div class="details__field">
              <p class="details__field-label t-label-small">CLASS</p>
              <p class="details__field-value t-label-large">JSS 2B</p>
            </div>
            <span class="details__divider"></span>
            <div class="details__field">
              <p class="details__field-label t-label-small">STUDENT ID</p>
              <p class="details__field-value t-label-large">SC-2041</p>
            </div>
            <span class="details__divider"></span>
            <div class="details__field">
              <p class="details__field-label t-label-small">ARRIVED</p>
              <p class="details__field-value details__field-value--accent t-label-large">7:29 am</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="kiosk-bottombar">
      <p class="kiosk-count">
        <span class="t-title-medium">147</span>
        <span class="t-body-large kiosk-count__label">checked in today</span>
      </p>
      <p class="kiosk-bottombar__note t-label-large">clears in 2s…</p>
    </footer>
  </div>

</body>
</html>
