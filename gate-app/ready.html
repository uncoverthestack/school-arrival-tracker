<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gate Scanner — Ready</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Follow the OS light/dark preference — set before first paint to avoid a flash.
    (function () {
      var query = window.matchMedia('(prefers-color-scheme: dark)');
      function apply(e) { document.documentElement.dataset.theme = e.matches ? 'dark' : 'light'; }
      apply(query);
      query.addEventListener('change', apply);
    })();
  </script>
</head>
<body>

  <div class="kiosk">
    <header class="kiosk-topbar">
      <p class="kiosk-title t-title-large">Gate Scanner</p>
      <div class="kiosk-topbar__right">
        <div class="pill pill--arrival">
          <span class="pill__dot"></span>
          <span>Arrival</span>
        </div>
        <div class="kiosk-status">
          <span class="kiosk-status__dot"></span>
          <span class="t-title-medium">online</span>
          <span class="t-body-large kiosk-status__sep">·</span>
          <span class="t-title-medium">7:48 am</span>
        </div>
      </div>
    </header>

    <main class="kiosk-content">
      <div class="scan-view">
        <div class="id-card">
          <p class="id-card__label t-label-small">STUDENT</p>
          <span class="id-card__punch"></span>
          <div class="id-card__photo">
            <svg class="id-card__icon scan-reticle" viewBox="0 0 76 76" fill="none" aria-hidden="true">
              <path d="M4 20V8a4 4 0 0 1 4-4h12" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
              <path d="M56 4h12a4 4 0 0 1 4 4v12" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
              <path d="M72 56v12a4 4 0 0 1-4 4H56" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
              <path d="M20 72H8a4 4 0 0 1-4-4V56" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

        <p class="t-headline-large">Ready to scan</p>
        <p class="t-body-large kiosk-subtext">Hold your ID card to the reader</p>

        <p class="enter-code-link t-body-medium">
          Card won't scan?
          <a href="code-entry.html" class="link-button t-label-large">Enter code →</a>
        </p>
      </div>
    </main>

    <footer class="kiosk-bottombar">
      <p class="kiosk-count">
        <span class="t-title-medium">0</span>
        <span class="t-body-large kiosk-count__label">checked in today</span>
      </p>
      <p class="kiosk-ready t-label-large">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M1 5V2a1 1 0 0 1 1-1h3M17 5V2a1 1 0 0 0-1-1h-3M1 13v3a1 1 0 0 0 1 1h3M17 13v3a1 1 0 0 1-1 1h-3" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        ready for next student
      </p>
    </footer>
  </div>

</body>
</html>
