<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Colourful arc ring -->
  <!-- Orange arc: lower-left → upper-left (clockwise 212°→298°) -->
  <path d="M 58 174 A 86 86 0 0 1 17 64" fill="none" stroke="#F47920" stroke-width="9" stroke-linecap="round"/>
  <!-- Green arc: upper-left → near-top (clockwise 298°→342°) -->
  <path d="M 17 64 A 86 86 0 0 1 69 16" fill="none" stroke="#6DBE45" stroke-width="9" stroke-linecap="round"/>
  <!-- Pink arc: upper-right → right (clockwise 18°→78°) -->
  <path d="M 126 16 A 86 86 0 0 1 184 82" fill="none" stroke="#F06292" stroke-width="9" stroke-linecap="round"/>
  <!-- Purple arc: right → lower-right (clockwise 88°→138°) -->
  <path d="M 186 106 A 86 86 0 0 1 155 168" fill="none" stroke="#AB47BC" stroke-width="8" stroke-linecap="round"/>
  <!-- Teal arc: lower-right → lower-left (clockwise 143°→208°) -->
  <path d="M 148 172 A 86 86 0 0 1 44 176" fill="none" stroke="#26C6DA" stroke-width="9" stroke-linecap="round"/>

  <!-- Yellow sparkle dots at top -->
  <circle cx="84"  cy="13"  r="4"   fill="#F5A623"/>
  <circle cx="100" cy="10"  r="5.5" fill="#F5A623"/>
  <circle cx="116" cy="13"  r="3.5" fill="#F5A623"/>

  <!-- Colour accent dots -->
  <circle cx="11"  cy="100" r="5.5" fill="#29B6F6"/>
  <circle cx="30"  cy="170" r="4.5" fill="#F47920"/>
  <circle cx="186" cy="58"  r="5.5" fill="#EC407A"/>
  <circle cx="178" cy="152" r="5"   fill="#AB47BC"/>

  <!-- Door frame (dark navy) -->
  <rect x="36" y="28" width="72" height="142" rx="3" fill="#1A2B4A"/>

  <!-- Door interior – warm cream glow -->
  <rect x="42" y="34" width="58" height="130" rx="2" fill="#FFFDE7"/>
  <!-- Brighter glow at top -->
  <rect x="42" y="34" width="58" height="52" rx="2" fill="#FFF9C4"/>

  <!-- Pink heart (inside the door, upper area) -->
  <path d="M56 54 C56 51 52 49 49 52 C47 55 49 59 56 64 C63 59 65 55 63 52 C60 49 56 51 56 54Z" fill="#F48FB1"/>

  <!-- Open door panel (blue) angled outward to the right -->
  <path d="M 108 34 L 130 38 L 130 160 L 108 162 Z" fill="#42A5F5"/>
  <!-- Door edge / thickness -->
  <rect x="103" y="34" width="6" height="128" fill="#1E88E5"/>
  <!-- Doorknob -->
  <circle cx="122" cy="104" r="5" fill="#1565C0"/>

  <!-- Ground shadow -->
  <ellipse cx="75" cy="168" rx="22" ry="4.5" fill="rgba(80,100,140,0.18)"/>

  <!-- Stick figure (walking rightward through door) -->
  <!-- Head -->
  <circle cx="78" cy="70" r="13" fill="#ffffff" stroke="#1A2B4A" stroke-width="3"/>
  <!-- Hair tufts -->
  <line x1="76" y1="57" x2="74" y2="51" stroke="#1A2B4A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="81" y1="57" x2="82" y2="51" stroke="#1A2B4A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Winking left eye -->
  <path d="M72 68 Q75 66 78 68" fill="none" stroke="#1A2B4A" stroke-width="2" stroke-linecap="round"/>
  <!-- Right eye -->
  <circle cx="83" cy="68" r="2" fill="#1A2B4A"/>
  <!-- Smile -->
  <path d="M73 75 Q78 80 83 75" fill="none" stroke="#1A2B4A" stroke-width="2" stroke-linecap="round"/>

  <!-- Body -->
  <line x1="76" y1="83" x2="73" y2="128" stroke="#1A2B4A" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Backpack (yellow/orange) -->
  <rect x="72" y="86" width="18" height="28" rx="4" fill="#FFC107"/>
  <!-- Backpack strap at top -->
  <rect x="74" y="84" width="3" height="8" rx="1.5" fill="#FF8F00"/>
  <!-- Pocket -->
  <rect x="73" y="104" width="14" height="8" rx="2" fill="#FFB300"/>

  <!-- Arms -->
  <!-- Left arm forward (towards door interior) -->
  <line x1="73" y1="100" x2="58" y2="90" stroke="#1A2B4A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right arm back -->
  <line x1="73" y1="100" x2="86" y2="110" stroke="#1A2B4A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Legs (mid-stride) -->
  <!-- Left leg (forward) -->
  <line x1="73" y1="128" x2="60" y2="162" stroke="#1A2B4A" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Right leg (back) -->
  <line x1="73" y1="128" x2="84" y2="158" stroke="#1A2B4A" stroke-width="4.5" stroke-linecap="round"/>
</svg>
